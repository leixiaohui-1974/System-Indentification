[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital_twin_hydraulic_system"
version = "0.1.0"
description = "A simulation framework for a hydraulic digital twin with fault diagnosis."
authors = [{ name = "Jules", email = "jules@example.com" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["digital_twin_hydraulic_system*"]
exclude = ["tests*"]
