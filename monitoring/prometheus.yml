# Prometheus配置文件
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 规则文件
rule_files:
  - "alert_rules.yml"

# 抓取配置
scrape_configs:
  # Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 数字孪生水力系统
  - job_name: 'digital-twin-system'
    static_configs:
      - targets: ['digital-twin:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # 数据库
  - job_name: 'database'
    static_configs:
      - targets: ['database:5432']
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # 节点导出器（系统指标）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s

  # 容器指标
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s